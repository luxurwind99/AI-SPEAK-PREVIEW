<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>青青 AI 互動角色 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden;
         font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; }

  /* ===== 電腦版：16:9 舞台（背景、角色、對話框皆為滿版圖層） ===== */
  #ai-character-widget {
    position: relative; aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden;
    width: min(100vw, calc(100vh * 16 / 9), 1920px);
    background: #000 center / 100% 100% no-repeat;
  }
  #char-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  #char-img { width: 100%; height: 100%; object-fit: contain; display: block; }

  #chat-bubble-container {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 3;
    background: center / 100% 100% no-repeat; pointer-events: none;
  }
  #chat-text {
    position: absolute; z-index: 4; left: 16.5%; right: 10%; top: 66.5%; height: 14%;
    font-size: max(13px, 2.6cqw); font-weight: 500; color: #222; line-height: 1.35; text-align: left;
    overflow-y: auto; word-break: break-all; white-space: pre-wrap; scrollbar-width: thin;
  }
  .cursor::after { content: "▍"; color: #0b0706; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #controls {
    position: absolute; z-index: 4; left: 16.5%; right: 10%; top: 79.5%; height: 9%;
    display: flex; gap: .8cqw; align-items: center; justify-content: flex-end;
  }
  #talk-btn {
    background: #0b0706; color: #fff; border: 0; border-radius: 12px; cursor: pointer; font-weight: bold;
    padding: .8cqw 2.5cqw; font-size: max(13px, 2cqw); box-shadow: 0 4px 10px rgba(0,0,0,.3);
    transition: background .2s, transform .1s; white-space: nowrap; font-family: inherit;
  }
  #talk-btn:active { transform: scale(.95); }
  #talk-btn:disabled { opacity: .55; cursor: wait; }
  #talk-btn.listening { background: #d64545; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .9cqw rgba(214,69,69,.3); } }

  /* 名字頁籤：電腦版隱藏，手機版顯示 */
  #name-tab { display: none; }

  /* 只有瀏覽器不支援語音辨識時才會出現的備用輸入框 */
  #msg {
    flex: 1; min-width: 0; border: 1px solid #ccc; outline: 0; border-radius: 12px;
    padding: .8cqw 1.6cqw; font-size: max(16px, 1.8cqw); background: rgba(255,255,255,.95); color: #333;
  }

  /* ===== 手機版：直式舞台（比例依手機參考圖 1220:2000） ===== */
  body.mobile #ai-character-widget {
    aspect-ratio: 1220 / 2000;
    width: min(100vw, calc(100vh * 1220 / 2000));
  }
  body.mobile #name-tab {
    display: flex; align-items: center; position: absolute; z-index: 4;
    left: 9%; top: 46.2%; height: 5.1%; padding: 0 5cqw;
    background: #0b0706; color: #fff; white-space: nowrap;
    border-radius: 2.6cqw 2.6cqw 0 0; font-size: 3.8cqw; letter-spacing: .02em;
  }
  body.mobile #chat-text {
    left: 16.4%; right: 16%; top: 55%; height: 30%;
    font-size: 4.3cqw; line-height: 1.5;
  }
  body.mobile #controls {
    left: 22%; right: 22%; top: 88.5%; height: 8%; justify-content: center;
  }
  body.mobile #talk-btn {
    width: 100%; height: 100%; border-radius: 999px; font-size: 4.6cqw;
    padding: 0 3cqw; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1.5cqw 3cqw rgba(0,0,0,.3);
  }
  body.mobile #msg { border-radius: 999px; font-size: max(16px, 4.2cqw); }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="ai-character-widget">
  <div id="char-layer"><img id="char-img" alt="青青" draggable="false"></div>
  <div id="chat-bubble-container"></div>
  <div id="name-tab"></div>
  <div id="chat-text">你好，我是拉蒂設計的新進虛擬員工青青KIKI，有甚麼問題都可以問我喔！</div>
  <div id="controls">
    <input id="msg" type="text" placeholder="輸入文字…" autocomplete="off" enterkeyhint="send" hidden>
    <button id="talk-btn">點擊與我對話</button>
  </div>
</div>

<script>
/* ===================== 設定區 ===================== */
const CONFIG = {
  // 電腦版角色圖（待機 / 說話動畫）
  IMG_IDLE:   "https://res.cloudinary.com/c05zlkva/image/upload/v1793263310/%E4%B8%BB%E8%A7%921.png",
  IMG_SPEAK:  "https://res.cloudinary.com/c05zlkva/image/upload/v1793263852/AISPEAK.gif",

  // 手機版角色圖（待機 / 說話動畫）
  IMG_IDLE_MOBILE:  "https://res.cloudinary.com/c05zlkva/image/upload/v1793599053/%E9%9D%92%E9%9D%92%E6%93%AC%E4%BA%BA_%E6%89%8B%E6%A9%9F%E6%9D%BF.png",
  IMG_SPEAK_MOBILE: "https://res.cloudinary.com/c05zlkva/image/upload/v1793599030/AISPEAK-1.gif",

  // 電腦版背景與對話框
  IMG_BG:     "https://res.cloudinary.com/c05zlkva/image/upload/v1793264253/%E8%83%8C%E6%99%AF1.png",
  IMG_BUBBLE: "https://res.cloudinary.com/c05zlkva/image/upload/v1793264208/%E5%B0%8D%E8%A9%B1%E6%A1%86-07.png",

  // 手機版背景與對話框
  IMG_BG_MOBILE:     "https://res.cloudinary.com/c05zlkva/image/upload/v1793597923/%E9%9D%92%E9%9D%92%E6%93%AC%E4%BA%BA-04.png",
  IMG_BUBBLE_MOBILE: "https://res.cloudinary.com/c05zlkva/image/upload/v1793597923/%E9%9D%92%E9%9D%92%E6%93%AC%E4%BA%BA-03.png",

  NAME: "青青KIKI",     // 手機版名字頁籤
  GREETING: "你好，我是拉蒂設計的新進虛擬員工青青KIKI，有甚麼問題都可以問我喔！",

  // AI 後端（Cloudflare Worker）。留空 = 離線示範模式。⚠️ 請勿把任何 API 金鑰寫在這個檔案裡。
  API_ENDPOINT: "https://qingqing-ai.luxurwind.workers.dev/",

  LABEL_IDLE: "點擊與我對話",
  MAX_HISTORY: 12,
  TYPE_SPEED: 45,       // 打字速度（毫秒/字）
  LANG: "zh-TW",
};

/* ===================== 初始化 ===================== */
const $ = id => document.getElementById(id);
const widget = $("ai-character-widget"), charImg = $("char-img"), chatText = $("chat-text"),
      talkBtn = $("talk-btn"), msg = $("msg"), bubble = $("chat-bubble-container"), nameTab = $("name-tab");

// 依螢幕比例切換電腦版 / 手機版（寬螢幕為電腦版，直式或窄螢幕為手機版）
const mobileMQ = matchMedia("(max-width: 768px), (max-aspect-ratio: 4/5)");
const isMobile = () => document.body.classList.contains("mobile");
const idleSrc = () => isMobile() ? CONFIG.IMG_IDLE_MOBILE : CONFIG.IMG_IDLE;
const speakSrc = () => isMobile() ? CONFIG.IMG_SPEAK_MOBILE : CONFIG.IMG_SPEAK;

function applyLayout() {
  const m = mobileMQ.matches;
  document.body.classList.toggle("mobile", m);
  widget.style.backgroundImage = `url("${m ? CONFIG.IMG_BG_MOBILE : CONFIG.IMG_BG}")`;
  bubble.style.backgroundImage = `url("${m ? CONFIG.IMG_BUBBLE_MOBILE : CONFIG.IMG_BUBBLE}")`;
  if (!speaking) charImg.src = idleSrc();   // 切換版型時，角色圖跟著換
}
let speaking = false;
applyLayout();
mobileMQ.addEventListener("change", applyLayout);

nameTab.textContent = CONFIG.NAME;
chatText.textContent = CONFIG.GREETING;
new Image().src = CONFIG.IMG_SPEAK;          // 預載說話動畫（電腦版）
new Image().src = CONFIG.IMG_SPEAK_MOBILE;   // 預載說話動畫（手機版）
new Image().src = CONFIG.IMG_BG_MOBILE;
new Image().src = CONFIG.IMG_BUBBLE_MOBILE;

let history = [], busy = false, listening = false, typeTimer = null, speakToken = 0;
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function setBtn(label, state) {          // state: "" | "listening" | "busy"
  talkBtn.textContent = label;
  talkBtn.classList.toggle("listening", state === "listening");
  talkBtn.disabled = state === "busy";
}

/* ===================== 角色狀態 ===================== */
function setSpeaking(on) {
  speaking = on;
  // 加上時間戳，讓 GIF 每次都從頭播放
  charImg.src = on ? speakSrc() + (speakSrc().includes("?") ? "&" : "?") + "t=" + Date.now()
                   : idleSrc();
}

/* ===================== 說話：打字 + 語音 + 動畫同步 ===================== */
function pickVoice() {
  const vs = synth.getVoices();
  return vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null;
}

let audioEl = null;
const ttsCache = new Map();
function ttsUrl() { return CONFIG.API_ENDPOINT.replace(/\/?$/, "/") + "tts"; }
async function fetchVoice(text) {        // 向 Worker 要語音檔；失敗回傳 null
  if (!CONFIG.API_ENDPOINT) return null;
  if (ttsCache.has(text)) return ttsCache.get(text);
  try {
    const res = await fetch(ttsUrl(), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    if (!res.ok) return null;
    const url = URL.createObjectURL(await res.blob());
    ttsCache.set(text, url);
    return url;
  } catch (e) { return null; }
}

function stopSpeaking() {                // 打斷目前的說話
  speakToken++;
  clearInterval(typeTimer);
  synth && synth.cancel();
  if (audioEl) { audioEl.pause(); audioEl = null; }
  chatText.classList.remove("cursor");
  setSpeaking(false);
}

async function say(text) {
  const token = ++speakToken;
  clearInterval(typeTimer);
  synth && synth.cancel();
  if (audioEl) { audioEl.pause(); audioEl = null; }
  const voiceUrl = await fetchVoice(text);   // 先取得聲音，文字與聲音才能同步
  if (token !== speakToken) return;          // 取音期間已被打斷
  return new Promise(resolve => {
    chatText.textContent = "";
    chatText.classList.add("cursor");
    setSpeaking(true);

    const chars = Array.from(text);
    let i = 0, typed = false, spoken = false;
    const finish = () => {
      if (token !== speakToken) { resolve(); return; }   // 已被打斷
      if (!(typed && spoken)) return;
      chatText.classList.remove("cursor");
      setSpeaking(false);
      resolve();
    };

    typeTimer = setInterval(() => {
      if (token !== speakToken) { clearInterval(typeTimer); resolve(); return; }
      chatText.textContent += chars[i++];
      chatText.scrollTop = chatText.scrollHeight;
      if (i >= chars.length) { clearInterval(typeTimer); typed = true; finish(); }
    }, CONFIG.TYPE_SPEED);

    const useSynth = () => {                 // 備援：瀏覽器內建語音
      if (!synth) { spoken = true; finish(); return; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = CONFIG.LANG; u.rate = 1.05; u.pitch = 1.5;
      const v = pickVoice(); if (v) u.voice = v;
      u.onend = u.onerror = () => { spoken = true; finish(); };
      synth.speak(u);
    };

    if (voiceUrl) {
      const a = audioEl = new Audio(voiceUrl);
      a.onended = a.onerror = () => { spoken = true; finish(); };
      a.play().catch(() => { if (token === speakToken) { audioEl = null; useSynth(); } });
    } else useSynth();
  });
}

/* ===================== AI 對話 ===================== */
const DEMO_REPLIES = [
  [/你好|哈囉|嗨|hi|hello/i, "蝦毀！"],
  [/作品|設計|案例/, "代表作品有台北市木柵動物園馬特展，新北市育兒寶貝袋繪本封面，台北市一零一大樓茶包包裝封面等等，可以前往搜尋拉蒂設計觀看喔"],
  [/價|錢|費用|報價/, "詳細價格請找我們老闆討論喔，去FB留言"],
  [/謝謝|感謝/, "感恩～"],
];
const demoReply = t => (DEMO_REPLIES.find(([re]) => re.test(t)) || [])[1]
  || "青青聽到了！（離線示範中，接上 AI 後就能暢聊囉）";

async function askAI(userText) {
  history.push({ role: "user", content: userText });
  history = history.slice(-CONFIG.MAX_HISTORY);

  if (!CONFIG.API_ENDPOINT) {
    await new Promise(r => setTimeout(r, 500));
    const reply = demoReply(userText);
    history.push({ role: "assistant", content: reply });
    return reply;
  }
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(CONFIG.API_ENDPOINT, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }), signal: ctrl.signal,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const reply = ((await res.json()).reply || "").trim();
    if (!reply) throw new Error("empty reply");
    history.push({ role: "assistant", content: reply });
    return reply;
  } finally { clearTimeout(timer); }
}

async function handleSend(text) {
  busy = true; setBtn("思考中…", "busy");
  chatText.classList.remove("cursor");
  chatText.textContent = "青青想一想…";
  let reply;
  try { reply = await askAI(text); }
  catch (err) { console.error(err); history.pop(); reply = "不好意思，網路訊號好像有點不好，聽不太清楚"; }
  busy = false; setBtn(CONFIG.LABEL_IDLE);
  await say(reply);                      // 說話時按鈕仍可按：按下去就會打斷並重新聆聽
}

/* ===================== 語音輸入：按一下錄音，說完自動辨識並回答 ===================== */
function startListening() {
  stopSpeaking();
  const rec = new SR();
  rec.lang = CONFIG.LANG; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalText = "", interim = "", errCode = "";

  rec.onstart = () => {
    listening = true; setBtn("聆聽中…（再按一下結束）", "listening");
    chatText.classList.remove("cursor"); chatText.textContent = "我在聽喔…";
  };
  rec.onresult = e => {
    interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    chatText.textContent = (finalText + interim) || "我在聽喔…";   // 即時顯示聽到的內容
  };
  rec.onerror = e => { errCode = e.error; };
  rec.onend = () => {
    listening = false; setBtn(CONFIG.LABEL_IDLE);
    const text = (finalText || interim).trim();
    if (text) handleSend(text);
    else if (errCode === "not-allowed" || errCode === "service-not-allowed") say("請先允許瀏覽器使用麥克風喔！");
    else say("不好意思，網路訊號好像有點不好，聽不太清楚");
  };
  try { rec.start(); } catch (_) { listening = false; setBtn(CONFIG.LABEL_IDLE); }
  startListening.rec = rec;
}

talkBtn.addEventListener("click", () => {
  if (busy) return;
  if (!SR) {                             // 備用：不支援語音辨識的瀏覽器改用打字
    const t = msg.value.trim();
    if (t) { msg.value = ""; handleSend(t); } else msg.focus();
    return;
  }
  if (listening) { startListening.rec.stop(); return; }   // 手動結束錄音 → 觸發 onend 自動回答
  startListening();
});

if (!SR) {
  msg.hidden = false; talkBtn.textContent = "送出";
  CONFIG.LABEL_IDLE = "送出"; chatText.textContent = "你好，我是青青！（此瀏覽器不支援語音輸入，請用 Chrome 或 Edge，或直接打字給我）";
  msg.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); talkBtn.click(); }
  });
}
</script>
</body>
</html>
